<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    {% include custom-head.html %}
  </head>
  <body>
    <div class="wrapper">
      <aside class="sidebar">
        {% if site.logo %}
          <a href="{{ "/" | relative_url }}"><img class="portrait" src="{{ site.logo | relative_url }}" alt="Portrait of {{ site.title }}"></a>
        {% endif %}
        <div class="intro">
          <h1><a href="{{ "/" | relative_url }}">{{ site.title }}</a></h1>
          {% if site.position %}<p class="position">{{ site.position }}<br>{{ site.affiliation }}</p>{% endif %}
          <p class="contact">
            {% if site.cv %}<a href="{{ site.cv | relative_url }}" target="_blank" rel="noopener noreferrer">CV</a>{% endif %}
            {% if site.email_display %}<span>{{ site.email_display }}</span>{% endif %}
          </p>
        </div>
      </aside>

      <main>
        {{ content }}
      </main>
    </div>
  </body>
</html>
